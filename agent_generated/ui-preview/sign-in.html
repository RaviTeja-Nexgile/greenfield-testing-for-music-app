<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Direction A</title>
<script type="application/json" id="tokens">{"colors":{"primary":"#4f46e5","primary-hover":"#4338ca","on-primary":"#ffffff","background":"#f8fafc","surface":"#ffffff","surface-variant":"#f1f5f9","text":"#0f172a","text-muted":"#64748b","outline":"#e2e8f0","outline-variant":"#eef2f7","focus-ring":"#c7d2fe","error":"#dc2626"},"font":"Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"}</script>
<style>
:root {
  --primary:#4f46e5;
  --primary-hover:#4338ca;
  --on-primary:#ffffff;
  --background:#f8fafc;
  --surface:#ffffff;
  --surface-variant:#f1f5f9;
  --text:#0f172a;
  --text-muted:#64748b;
  --outline:#e2e8f0;
  --outline-variant:#eef2f7;
  --focus-ring:#c7d2fe;
  --error:#dc2626;
  --error-bg:#fef2f2;
  --error-border:#fecaca;
  --radius-sm:0.375rem;
  --radius-md:0.5rem;
  --radius-lg:0.75rem;
  --radius-xl:1rem;
  --shadow-sm:0 1px 2px rgba(15,23,42,0.05);
  --shadow-md:0 4px 6px -1px rgba(15,23,42,0.08);
  --shadow-lg:0 10px 15px -3px rgba(15,23,42,0.1);
  --font:Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--background);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:24px;
}
.card{
  width:100%;
  max-width:420px;
  background:var(--surface);
  border:1px solid var(--outline);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-sm);
  padding:40px 32px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:32px;
}
.brand-mark{
  width:36px;height:36px;
  border-radius:var(--radius-md);
  background:var(--primary);
  color:var(--on-primary);
  display:flex;align-items:center;justify-content:center;
}
.brand-name{
  font-size:1.25rem;
  font-weight:700;
  letter-spacing:-0.02em;
}
h1{
  font-size:1.5rem;
  font-weight:700;
  letter-spacing:-0.02em;
  line-height:1.3;
  margin-bottom:8px;
}
.subtitle{
  font-size:0.875rem;
  color:var(--text-muted);
  line-height:1.5;
  margin-bottom:28px;
}
.field{margin-bottom:18px}
label{
  display:block;
  font-size:0.875rem;
  font-weight:500;
  margin-bottom:6px;
}
.input{
  width:100%;
  height:44px;
  padding:0 14px;
  font-size:0.9375rem;
  font-family:inherit;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--outline);
  border-radius:var(--radius-md);
  transition:border-color 150ms ease-out, box-shadow 150ms ease-out;
}
.input::placeholder{color:var(--text-muted)}
.input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--focus-ring);
}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}
.check{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:0.875rem;
  color:var(--text-muted);
  cursor:pointer;
}
.check input{width:16px;height:16px;accent-color:var(--primary)}
.link{
  font-size:0.875rem;
  color:var(--primary);
  text-decoration:none;
  font-weight:500;
}
.link:hover{text-decoration:underline}
.btn{
  width:100%;
  height:46px;
  border:none;
  border-radius:var(--radius-md);
  background:var(--primary);
  color:var(--on-primary);
  font-size:0.9375rem;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  transition:background-color 150ms ease-out, box-shadow 150ms ease-out;
}
.btn:hover{background:var(--primary-hover);box-shadow:var(--shadow-md)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus-ring)}
.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:24px 0;
  color:var(--text-muted);
  font-size:0.8125rem;
}
.divider::before,.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--outline-variant);
}
.btn-ghost{
  width:100%;
  height:46px;
  border:1px solid var(--outline);
  border-radius:var(--radius-md);
  background:var(--surface);
  color:var(--text);
  font-size:0.9375rem;
  font-weight:500;
  font-family:inherit;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:background-color 150ms ease-out;
}
.btn-ghost:hover{background:var(--surface-variant)}
.btn-ghost:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus-ring)}
.footer{
  text-align:center;
  margin-top:24px;
  font-size:0.875rem;
  color:var(--text-muted);
}
.error-banner{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--error-bg);
  border:1px solid var(--error-border);
  color:var(--error);
  font-size:0.875rem;
  border-radius:var(--radius-md);
  padding:10px 12px;
  margin-bottom:20px;
}
@media (max-width:480px){
  body{padding:16px;align-items:flex-start;padding-top:32px}
  .card{padding:32px 20px;box-shadow:none;border:none;background:transparent}
}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l12-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </span>
    <span class="brand-name">Resonance</span>
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to keep listening to your music, playlists and recommendations.</p>

  <div class="error-banner" role="alert">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span>Email or password is incorrect.</span>
  </div>

  <form>
    <div class="field">
      <label for="email">Email</label>
      <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email" value="maria@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="input" id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="row">
      <label class="check"><input type="checkbox"> Remember me</label>
      <a class="link" href="#">Forgot password?</a>
    </div>
    <button class="btn" type="button">Sign in</button>
  </form>

  <div class="divider">or continue with</div>
  <button class="btn-ghost" type="button">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
    Continue with Google
  </button>

  <p class="footer">New to Resonance? <a class="link" href="#">Create an account</a></p>
</main>
</body>
</html>
