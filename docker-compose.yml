services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: resonance
      POSTGRES_DB: resonance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
